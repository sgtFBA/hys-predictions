name: Update predictions dashboard

on:
  schedule:
    # Daily safety-net check, catches anything missed overnight/midweek
    - cron: '7 7 * * *'
    # Hourly from ~midday to midnight UTC on the main matchdays:
    # Sunday(0), Monday(1), Friday(5), Saturday(6)
    - cron: '12 12-23 * * 0,1,5,6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest standings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 fetch_standings.py data.json

      - name: Regenerate dashboard
        run: python3 generate_dashboard.py data.json index.html

      - name: Commit and push if changed
        run: |
          git config user.name "predictions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily standings refresh"
            git push
          fi
